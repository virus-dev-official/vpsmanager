# Builds VPSManager.dmg when a GitHub release is published and attaches it to that
# release, so https://github.com/virus-dev-official/vpsmanager/releases/latest/download/VPSManager.dmg
# always points at the newest build.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: xcodebuild -downloadComponent MetalToolchain || true
      - run: ./scripts/make_dmg.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/VPSManager.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
